<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <title>کتابخانه - تماس</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: #f9f9f9;
            color: #111;
        }

        nav {
            background: #ffffff;
            padding: 20px 40px;
            display: flex;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
        }

        nav a {
            margin-left: 25px;
            text-decoration: none;
            color: #222;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover { color: #000; }

        .container {
            max-width: 700px;
            margin: 70px auto;
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0px 4px 18px rgba(0,0,0,0.08);
        }

        h1 { font-size: 32px; }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #ccc;
            margin-top: 15px;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #000;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">خانه</a>
        <a href="books.html">کتاب‌ها</a>
        <a href="about.html">درباره</a>
        <a href="contact.html">تماس</a>
    </nav>

    <div class="container">
        <h1>تماس با ما</h1>

        <input type="text" placeholder="نام شما">
        <input type="email" placeholder="ایمیل شما">
        <textarea rows="5" placeholder="پیامتان را بنویسید..."></textarea>

        <button>ارسال</button>
    </div>

</body>
</html>
